<!doctype html>
<html>
<head><meta charset="utf-8"><title>Unknown editor layout</title></head>
<body>
<!--
  A page whose structure does NOT match DEFAULT_SELECTORS, standing in for a
  version of Earth Studio the agent has not been taught yet. The inspect command
  must still describe every field well enough to write new selectors from.
-->
<div class="es-app">
  <div class="timeline-bar">
    <span class="lbl">Frame</span>
    <input class="tl-num" id="playhead-frame" value="0">
  </div>
  <div class="attr-panel">
    <div class="attr-row"><span class="lbl">Latitude</span><input class="num-field" aria-label="Latitude" value="0"></div>
    <div class="attr-row"><span class="lbl">Longitude</span><input class="num-field" aria-label="Longitude" value="0"></div>
    <div class="attr-row"><span class="lbl">Altitude</span><input class="num-field" aria-label="Altitude" value="0"></div>
    <div class="attr-row"><span class="lbl">Pan</span><input class="num-field" aria-label="Pan" value="0"></div>
  </div>
</div>
</body>
</html>
