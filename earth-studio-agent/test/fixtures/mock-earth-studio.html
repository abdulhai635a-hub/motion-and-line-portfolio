<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mock Earth Studio</title>
</head>
<body>
<!--
  A stand-in for the Earth Studio editor, used to test the browser driver
  without a Google account.

  It reproduces the one behaviour the driver depends on: committing a value in a
  camera attribute field creates a keyframe for that attribute at the current
  frame. Query flags simulate failure modes:
    ?missing=altitude   drop a field, so the layout check must fail
    ?clamp=altitude     clamp the field, so the read-back check must fail
-->
<div data-earth-studio-app>
  <div class="timeline">
    <label data-attribute="currentFrame">Current frame <input id="currentFrame" value="0"></label>
  </div>
  <div class="attributes">
    <label data-attribute="latitude">Latitude <input value="0"></label>
    <label data-attribute="longitude">Longitude <input value="0"></label>
    <label data-attribute="altitude">Altitude <input value="0"></label>
    <label data-attribute="pan">Pan <input value="0"></label>
    <label data-attribute="tilt">Tilt <input value="0"></label>
    <label data-attribute="roll">Roll <input value="0"></label>
    <label data-attribute="fieldOfView">Field of View <input value="60"></label>
  </div>
</div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var missing = (params.get('missing') || '').split(',').filter(Boolean);
  var clamp = (params.get('clamp') || '').split(',').filter(Boolean);
  var clampMax = Number(params.get('clampMax') || '1000');

  missing.forEach(function (name) {
    var node = document.querySelector('[data-attribute="' + name + '"]');
    if (node) node.remove();
  });

  // keyframes[attribute][frame] = value, mirroring Earth Studio's model of one
  // keyframe per attribute per frame.
  window.__keyframes = {};
  window.__writeOrder = [];

  function currentFrame() {
    var input = document.querySelector('[data-attribute="currentFrame"] input');
    var value = Number(input ? input.value : 0);
    return Number.isFinite(value) ? value : 0;
  }

  document.querySelectorAll('.attributes [data-attribute]').forEach(function (group) {
    var name = group.getAttribute('data-attribute');
    var input = group.querySelector('input');
    if (!input) return;

    input.addEventListener('keydown', function (event) {
      if (event.key !== 'Enter') return;
      var value = Number(input.value);
      if (!Number.isFinite(value)) return;
      if (clamp.indexOf(name) !== -1 && Math.abs(value) > clampMax) {
        // Stands in for a field that rejects the value it was given.
        value = value > 0 ? clampMax : -clampMax;
        input.value = String(value);
      }
      var frame = currentFrame();
      if (!window.__keyframes[name]) window.__keyframes[name] = {};
      window.__keyframes[name][frame] = value;
      window.__writeOrder.push({ attribute: name, frame: frame, value: value });
    });
  });
})();
</script>
</body>
</html>
