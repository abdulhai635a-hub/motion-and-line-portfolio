<!doctype html>
<html>
<head><meta charset="utf-8"><title>Untitled - Google Earth Studio</title></head>
<body>
<!--
  Copied from the markup the live Earth Studio actually returned, so the probe
  and the driver can be developed against the real shape:

    li.attribute[data-attribute-type] > span.title
                                      > span.actions > span.value
                                          > span.scrub-input.valueInput
                                              > span.presentedValueContainer > span.presentedValue
                                              > span.unit[title]
                                      > button[data-action="click:addKeyframe"]

  Longitude carries two widgets (whole rotations plus degrees); altitude is
  displayed in kilometres while the underlying attribute is metres.

  Clicking a widget here reveals an input, which is one plausible editing
  gesture; the probe's job is to report whatever actually happens, so the real
  behaviour can be read off a real session rather than assumed.
-->
<style>
  /* The live editor reveals the keyframe button on hover, which is why the
     driver hovers the row before clicking it. */
  /* display:none rather than opacity, so a click really does need the hover -
     an invisible-but-present button would be clickable without it and the
     hover step would go untested. */
  .add-keyframe { display: none; }
  li.attribute:hover .add-keyframe, .add-keyframe.has-keyframe { display: inline-block; }
</style>
<div data-earth-studio-app>
<div class="playback-controls"><ul>
  <li class="control" data-action="click:jumpWorkspaceStart" tabindex="0"><span class="icon-start" title-tooltip="Jump to Workspace Start"></span></li>
  <li class="control" data-action="click:backward" tabindex="0"><span class="icon-rewind" title-tooltip="Previous Frame"></span></li>
  <li class="control" data-action="click:forward" tabindex="0"><span class="icon-forward" title-tooltip="Next Frame"></span></li>
  <li class="control" data-action="click:jumpWorkspaceEnd" tabindex="0"><span class="icon-end" title-tooltip="Jump to Workspace End"></span></li>
  <li class="control timecode" data-action="click:toggleTimeFormat" data-value="model.timecode" tabindex="0" title-tooltip="Toggle Time Format">0</li>
</ul></div>
<ul class="attribute-list">
  <li class="attribute visible" data-attribute-type="longitude">
    <span class="title">Longitude</span>
    <span class="actions">
      <span class="value">
        <span class="scrub-input rotationInput" tabindex="0"><span class="presentedValueContainer"><span class="presentedValue">0</span></span><span class="unit rotations" title="Rotations">x</span></span>
        <span class="scrub-input valueInput" tabindex="0"><span class="presentedValueContainer"><span class="presentedValue">-34.646</span></span><span class="unit degrees" title="Degrees">&deg;</span></span>
      </span>
      <button class="btn-icon add-keyframe" data-action="click:addKeyframe" data-track-value="Longitude" title-tooltip="Add keyframe"></button>
    </span>
  </li>
  <li class="attribute visible" data-attribute-type="latitude">
    <span class="title">Latitude</span>
    <span class="actions">
      <span class="value">
        <span class="scrub-input valueInput" tabindex="0"><span class="presentedValueContainer"><span class="presentedValue">-15.018</span></span><span class="unit degrees" title="Degrees">&deg;</span></span>
      </span>
      <button class="btn-icon add-keyframe" data-action="click:addKeyframe" data-track-value="Latitude" title-tooltip="Add keyframe"></button>
    </span>
  </li>
  <li class="attribute visible" data-attribute-type="altitude">
    <span class="title">Altitude</span>
    <span class="actions">
      <span class="value">
        <span class="scrub-input valueInput" tabindex="0"><span class="presentedValueContainer"><span class="presentedValue">63170</span></span><span class="unit meters" title="Kilometers">km</span></span>
      </span>
      <button class="btn-icon add-keyframe" data-action="click:addKeyframe" data-track-value="Altitude" title-tooltip="Add keyframe"></button>
    </span>
  </li>
  <li class="attribute visible" data-attribute-type="rotationX">
    <span class="title">Pan</span>
    <span class="actions">
      <span class="value">
        <span class="scrub-input rotationInput" tabindex="0"><span class="presentedValueContainer"><span class="presentedValue">0</span></span><span class="unit rotations" title="Rotations">x</span></span>
        <span class="scrub-input valueInput" tabindex="0"><span class="presentedValueContainer"><span class="presentedValue">355.743</span></span><span class="unit degrees" title="Degrees">&deg;</span></span>
      </span>
      <button class="btn-icon add-keyframe" data-action="click:addKeyframe" data-track-value="Pan" title-tooltip="Add keyframe"></button>
    </span>
  </li>
  <li class="attribute visible" data-attribute-type="rotationY">
    <span class="title">Tilt</span>
    <span class="actions">
      <span class="value">
        <span class="scrub-input valueInput" tabindex="0"><span class="presentedValueContainer"><span class="presentedValue">0</span></span><span class="unit degrees" title="Degrees">&deg;</span></span>
      </span>
      <button class="btn-icon add-keyframe" data-action="click:addKeyframe" data-track-value="Tilt" title-tooltip="Add keyframe"></button>
    </span>
  </li>
  <li class="attribute visible" data-attribute-type="rotationZ">
    <span class="title">Roll</span>
    <span class="actions">
      <span class="value">
        <span class="scrub-input rotationInput" tabindex="0"><span class="presentedValueContainer"><span class="presentedValue">0</span></span><span class="unit rotations" title="Rotations">x</span></span>
        <span class="scrub-input valueInput" tabindex="0"><span class="presentedValueContainer"><span class="presentedValue">0</span></span><span class="unit degrees" title="Degrees">&deg;</span></span>
      </span>
      <button class="btn-icon add-keyframe" data-action="click:addKeyframe" data-track-value="Roll" title-tooltip="Add keyframe"></button>
    </span>
  </li>
  <li class="attribute visible" data-attribute-type="fov">
    <span class="title">Field of View</span>
    <span class="actions">
      <span class="value">
        <span class="scrub-input valueInput" tabindex="0"><span class="presentedValueContainer"><span class="presentedValue">20</span></span><span class="unit degrees" title="Degrees">&deg;</span></span>
      </span>
      <button class="btn-icon add-keyframe" data-action="click:addKeyframe" data-track-value="Field of View" title-tooltip="Add keyframe"></button>
    </span>
  </li>
</ul>
</div>
<script>
(function () {
  // Mirrors the gesture the live editor was observed to use: clicking the value
  // widget adds an "editing" class and inserts
  //   <div contenteditable="true" class="input">FULL PRECISION VALUE</div>
  // inside .presentedValueContainer, with the text selected. Enter commits and
  // Escape cancels, both removing the div and restoring .presentedValue.
  //
  // The full-precision text matters: it is how the driver works out whether the
  // edit box uses the same unit as the rounded display.
  // Altitude is always typed in metres but shown in whichever unit suits its
  // size, and the unit element is relabelled with it. The live editor showed
  // 1500 m as "1500 m" and 63170000 m as "63170 km"; the exact threshold is not
  // published, and the driver does not depend on it - it reads the label every
  // time - so ten kilometres is used here to exercise both sides.
  var altitudeDisplay = function (metres) {
    return Math.abs(metres) >= 10000
      ? { value: metres / 1000, unit: 'km', title: 'Kilometers' }
      : { value: metres, unit: 'm', title: 'Meters' };
  };

  // The exact value behind each rounded display. The edit box always opens on
  // the current value at full precision, which is how the driver works out
  // which unit the box is using.
  var EXACT = {
    longitude: 131.5689731,
    latitude: 29.3228910257184,
    altitude: 63170482.1,
    rotationX: 355.7431102,
    rotationY: 0,
    rotationZ: 0,
    fov: 20
  };

  // How this project's value fields decide a click has happened. The live app
  // opens on a plain click; tests set window.__openOn to stand in for the two
  // ways a synthetic click can miss one that does not.
  //   'click'    - a click event, as the live editor behaves
  //   'mouse'    - only a mousedown/mouseup pair counts, click alone does not
  //   'dblclick' - only a double click opens the box
  //   'channel'  - only input delivered by the browser, never a scripted event
  //   'never'    - nothing opens it, for the failure message
  // window.__pointerCaptureThrows makes pointerdown throw the way a real
  // setPointerCapture does when handed a pointerId no real pointer owns, which
  // kills the rest of the handler with it.
  window.__openOn = 'click';
  window.__pointerCaptureThrows = false;
  // How many times typing into a freshly opened box is thrown away before it
  // starts landing. Stands in for a keystroke lost to a focus change, which
  // left a live run committing the value the box already held.
  window.__swallowTyping = 0;

  document.querySelectorAll('.scrub-input').forEach(function (widget) {
    var pressed = false;
    widget.addEventListener('pointerdown', function (event) {
      if (window.__pointerCaptureThrows) {
        // Same shape as the real failure: the handler throws before it can do
        // anything else, so nothing downstream of it ever runs.
        throw new DOMException('No active pointer with the given id', 'NotFoundError');
      }
    });
    widget.addEventListener('mousedown', function () { pressed = true; });
    widget.addEventListener('mouseup', function () {
      if (pressed && window.__openOn === 'mouse') open();
      pressed = false;
    });
    widget.addEventListener('dblclick', function () {
      if (window.__openOn === 'dblclick') open();
    });
    widget.addEventListener('click', function () {
      if (window.__openOn === 'click') open();
    });
    // 'channel' stands in for a field that opens for input delivered by the
    // browser and for nothing a script can dispatch itself - which is how the
    // live editor behaves, and why the extension asks Chrome to send the input.
    widget.addEventListener('agenttestclick', function () {
      if (window.__openOn === 'channel') open();
    });

    function open() {
      if (widget.querySelector('[contenteditable]')) return;
      var row = widget.closest('[data-attribute-type]');
      var type = row ? row.getAttribute('data-attribute-type') : '';
      var presented = widget.querySelector('.presentedValue');
      var container = widget.querySelector('.presentedValueContainer');
      var box = document.createElement('div');
      box.setAttribute('contenteditable', 'true');
      box.className = 'input';
      box.textContent = String(EXACT[type] !== undefined ? EXACT[type] : Number(presented.textContent));
      // While editing, Earth Studio relabels a kilometre field "Meters" - the
      // underlying unit - even though the number beside it is still kilometres.
      var unit = widget.querySelector('.unit');
      var restingTitle = unit ? unit.getAttribute('title') : '';
      if (unit && restingTitle === 'Kilometers') unit.setAttribute('title', 'Meters');
      container.appendChild(box);
      // Each swallowed attempt puts the box back the way it was, so Enter would
      // commit the old value - which is what a lost keystroke does.
      var original = box.textContent;
      var undo = new MutationObserver(function () {
        if (window.__swallowTyping > 0 && box.textContent !== original) {
          window.__swallowTyping -= 1;
          box.textContent = original;
        }
      });
      undo.observe(box, { characterData: true, childList: true, subtree: true });
      widget.classList.add('editing');
      widget.setAttribute('tabindex', '-1');
      box.focus();
      document.getSelection().selectAllChildren(box);
      // Tests set this to stand in for a session where focus does not stay on
      // the edit box, which is what left a live write uncommitted.
      if (window.__stealFocus) setTimeout(function () { document.body.focus(); }, 10);

      var finish = function (commit) {
        var typed = Number(box.textContent);
        if (unit && restingTitle) unit.setAttribute('title', restingTitle);
        box.remove();
        widget.classList.remove('editing');
        widget.setAttribute('tabindex', '0');
        document.body.focus();
        // The live editor updates the readout a moment after the commit, not
        // synchronously, so a driver that reads it immediately sees the old
        // value. The delay here is what makes that failure reproducible.
        if (commit && Number.isFinite(typed)) {
          EXACT[type] = typed;
          setTimeout(function () {
            if (type === 'altitude') {
              var shown = altitudeDisplay(typed);
              // The live editor shows an altitude in whole units - "63170" km,
              // "1500" m - so a value typed in metres comes back rounded to the
              // nearest kilometre once the field has switched.
              presented.textContent = String(Math.round(shown.value));
              if (unit) {
                unit.textContent = shown.unit;
                unit.setAttribute('title', shown.title);
                restingTitle = shown.title;
              }
              return;
            }
            presented.textContent = String(Math.round(typed * 1000) / 1000);
          }, window.__commitDelay || 150);
        }
      };

      box.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') { event.preventDefault(); finish(false); }
        if (event.key === 'Enter') { event.preventDefault(); finish(true); }
      });
    }
  });

  // The timecode readout: clicking cycles its display format, as the live one
  // does, and it cannot be typed into. Arrow keys move the playhead instead.
  var frame = 0;
  var format = 0;
  var readout = document.querySelector('.timecode');
  var FORMATS = [
    function () { return String(frame); },
    function () {
      var total = Math.floor(frame / 30);
      var hh = String(Math.floor(total / 3600)).padStart(2, '0');
      var mm = String(Math.floor((total % 3600) / 60)).padStart(2, '0');
      var ss = String(total % 60).padStart(2, '0');
      return hh + ':' + mm + ':' + ss;
    }
  ];
  var draw = function () {
    readout.textContent = FORMATS[format]();
    if (window.__refreshKeyframeMarkers) window.__refreshKeyframeMarkers();
  };
  readout.addEventListener('click', function () { format = (format + 1) % FORMATS.length; draw(); });
  window.__frame = function () { return frame; };
  // The transport buttons the live editor shows beside the readout.
  var move = function (delta) { frame = Math.max(0, Math.min(window.__lastFrame || LAST_FRAME, frame + delta)); setTimeout(draw, 30); };
  var bind = function (action, handler) {
    var node = document.querySelector('[data-action="' + action + '"]');
    if (node) node.addEventListener('click', handler);
  };
  bind('click:jumpWorkspaceStart', function () { frame = 0; setTimeout(draw, 30); });
  bind('click:jumpWorkspaceEnd', function () { frame = window.__lastFrame || LAST_FRAME; setTimeout(draw, 30); });
  bind('click:forward', function () { move(1); });
  bind('click:backward', function () { move(-1); });
  // Keyboard handling can be switched off, to stand in for a session where the
  // shortcuts never reach the application.
  window.__keyboardEnabled = true;
  // Tests raise this to stand in for a slow session.
  window.__commitDelay = 150;
  // The key behaviour observed on the live editor: arrows step one frame,
  // Shift+arrow steps five, Home and End jump to the ends. The readout updates
  // asynchronously there, so it does here too.
  // Long enough for a multi-place path; window.__lastFrame shortens it so the
  // too-long-for-the-project case can be tested.
  var LAST_FRAME = 1200;
  document.addEventListener('keydown', function (event) {
    if (document.querySelector('[contenteditable]')) return;
    if (!window.__keyboardEnabled) return;
    var step = event.shiftKey ? 5 : 1;
    if (event.key === 'ArrowRight' || event.key === 'PageUp') frame += step;
    else if (event.key === 'ArrowLeft' || event.key === 'PageDown') frame -= step;
    else if (event.key === 'Home') frame = 0;
    else if (event.key === 'End') frame = window.__lastFrame || LAST_FRAME;
    else return;
    frame = Math.max(0, Math.min(window.__lastFrame || LAST_FRAME, frame));
    event.preventDefault();
    setTimeout(draw, 30);
  });

  // Every attribute row carries an "add keyframe" button.
  // Keyframes are per attribute per frame, and the button carries the
  // has-keyframe class the live editor binds to hasKeyframeAtCurrentFrame.
  window.__keyframesAdded = [];
  var keyed = {};
  var keyOf = function (type, at) { return type + '@' + at; };

  var refreshMarkers = function () {
    document.querySelectorAll('[data-action="click:addKeyframe"]').forEach(function (button) {
      var row = button.closest('[data-attribute-type]');
      var type = row ? row.getAttribute('data-attribute-type') : '';
      button.classList.toggle('has-keyframe', keyed[keyOf(type, frame)] === true);
    });
  };
  window.__refreshKeyframeMarkers = refreshMarkers;

  document.querySelectorAll('[data-action="click:addKeyframe"]').forEach(function (button) {
    button.addEventListener('click', function () {
      var row = button.closest('[data-attribute-type]');
      var type = row ? row.getAttribute('data-attribute-type') : '';
      keyed[keyOf(type, frame)] = true;
      window.__keyframesAdded.push({
        type: type,
        frame: frame,
        // The degrees widget, not the whole-rotations one beside it in
        // longitude and the rotation rows.
        value: row ? row.querySelector('.scrub-input.valueInput .presentedValue').textContent : ''
      });
      refreshMarkers();
    });
  });
})();
</script>
</body>
</html>
